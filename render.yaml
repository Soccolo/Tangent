# Render Blueprint. In Render: New → Blueprint → point at this repo.
#
# This is configured for the FREE path: a free web service plus an external
# free Postgres (Neon or Supabase). Render's own free Postgres expires, and
# free instances have no persistent disk — so SQLite there gets wiped on every
# deploy. Keeping the database off-platform is what makes $0 actually work.
#
# Before deploying, create a free Postgres at neon.tech (or supabase.com) and
# have its connection string ready — Render will prompt you for DATABASE_URL
# and ANTHROPIC_API_KEY, the two vars marked `sync: false`.
#
# Plan names and free-tier terms change; verify against the dashboard rather
# than trusting these comments.
services:
  - type: web
    name: tangent
    runtime: python
    plan: free             # sleeps after ~15 min idle; see README for the trade-off
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: TANGENT_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false          # paste into the dashboard; never commit it
      - key: DATABASE_URL
        sync: false          # paste your Neon/Supabase connection string
      - key: TANGENT_SECRET
        generateValue: true  # Render generates and stores a random value
      - key: TANGENT_MODEL
        value: claude-opus-5
      - key: TANGENT_EFFORT
        value: high        # depth of the lessons; drop to medium to cut cost
      # Spend guards. Signup is open, so these are what stand between a public
      # URL and a surprising Anthropic bill. Tune once you see real usage.
      - key: TANGENT_DAILY_LESSON_CAP
        value: "6"
      - key: TANGENT_DAILY_DIGEST_CAP
        value: "4"
      - key: TANGENT_GLOBAL_DAILY_CAP
        value: "300"
      # Screen capture. Extraction runs many times an hour, so it uses a small
      # model: naming a task from a screenshot doesn't need a frontier model,
      # and every line is user-confirmed before it counts. Raise to
      # claude-sonnet-5 if the proposals need too much correcting.
      - key: TANGENT_VISION_MODEL
        value: claude-haiku-4-5
      - key: TANGENT_DAILY_CAPTURE_CAP
        value: "60"

# --- Paid alternative -------------------------------------------------------
# To use Render's own Postgres and an always-on service instead, set the web
# plan to `starter`, drop the DATABASE_URL entry above, and swap in:
#
#      - key: DATABASE_URL
#        fromDatabase:
#          name: tangent-db
#          property: connectionString
#
# databases:
#   - name: tangent-db
#     plan: basic-256mb
#     databaseName: tangent
#     user: tangent
